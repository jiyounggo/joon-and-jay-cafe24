<style>
  .jj-custom-event-banner {
    position: relative;
    z-index: 100000;
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4eadc;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    box-sizing: border-box;
  }

  .jj-custom-event-banner__message {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #111;
    font-family: "Montserrat", "Noto Sans KR", Arial, sans-serif;
    white-space: nowrap;
  }

  .jj-custom-event-banner__sparkle {
    display: inline-block;
    color: #ad9270;
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
  }

  .jj-custom-event-banner__label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .jj-custom-event-banner__divider {
    display: block;
    width: 1px;
    height: 15px;
    background: rgba(0, 0, 0, 0.55);
  }

  .jj-custom-event-banner__text {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  .jj-custom-event-banner__controls {
    position: absolute;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .jj-custom-event-banner__today {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #645b52;
    font-family: "Montserrat", "Noto Sans KR", Arial, sans-serif;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }

  .jj-custom-event-banner__checkbox {
    width: 11px;
    height: 11px;
    border: 1px solid #8d8175;
    box-sizing: border-box;
  }

  .jj-custom-event-banner__close {
    position: relative;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 0;
  }

  .jj-custom-event-banner__close::before,
  .jj-custom-event-banner__close::after {
    content: "";
    position: absolute;
    top: 1px;
    left: 8px;
    width: 1.5px;
    height: 16px;
    background: #222;
  }

  .jj-custom-event-banner__close::before {
    transform: rotate(45deg);
  }
  .jj-custom-event-banner__close::after {
    transform: rotate(-45deg);
  }

  @media all and (max-width: 767px) {
    .jj-custom-event-banner {
      height: 44px;
      padding: 0 42px 0 10px;
    }

    .jj-custom-event-banner__message {
      gap: 7px;
    }
    .jj-custom-event-banner__sparkle {
      font-size: 11px;
    }
    .jj-custom-event-banner__label {
      font-size: 11px;
    }
    .jj-custom-event-banner__divider {
      height: 11px;
    }
    .jj-custom-event-banner__text {
      font-size: 12px;
    }
    .jj-custom-event-banner__controls {
      right: 12px;
    }
    .jj-custom-event-banner__today {
      display: none;
    }
  }

  @media all and (max-width: 360px) {
    .jj-custom-event-banner__message {
      gap: 5px;
    }
    .jj-custom-event-banner__sparkle {
      display: none;
    }
    .jj-custom-event-banner__label {
      font-size: 10px;
    }
    .jj-custom-event-banner__text {
      font-size: 11px;
    }
  }
</style>

<div class="jj-custom-event-banner" id="jjCustomEventBanner">
  <div class="jj-custom-event-banner__message">
    <span class="jj-custom-event-banner__sparkle">✦</span>
    <span class="jj-custom-event-banner__label">OPEN EVENT</span>
    <span class="jj-custom-event-banner__divider"></span>
    <span class="jj-custom-event-banner__text">전 상품 무료배송</span>
    <span class="jj-custom-event-banner__sparkle">✦</span>
  </div>

  <div class="jj-custom-event-banner__controls">
    <button
      type="button"
      class="jj-custom-event-banner__today"
      id="jjHideToday"
    >
      <span class="jj-custom-event-banner__checkbox"></span>
      오늘 하루 보지 않기
    </button>

    <button
      type="button"
      class="jj-custom-event-banner__close"
      id="jjCloseBanner"
      aria-label="배너 닫기"
    >
      닫기
    </button>
  </div>
</div>

<script>
  (function () {
    var banner = document.getElementById("jjCustomEventBanner");
    var closeButton = document.getElementById("jjCloseBanner");
    var todayButton = document.getElementById("jjHideToday");
    if (!banner) return;

    var storageKey = "jj_event_banner_hide_until";

    function isHiddenToday() {
      try {
        var saved = localStorage.getItem(storageKey);
        return saved && Date.now() < Number(saved);
      } catch (e) {
        return false;
      }
    }

    function closeBanner() {
      banner.style.display = "none";
      window.dispatchEvent(new Event("jjBannerChanged"));
    }

    function hideToday() {
      try {
        var now = new Date();
        var tomorrow = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() + 1,
          0,
          0,
          0,
        );
        localStorage.setItem(storageKey, String(tomorrow.getTime()));
      } catch (e) {}
      closeBanner();
    }

    if (isHiddenToday()) closeBanner();
    if (closeButton) closeButton.addEventListener("click", closeBanner);
    if (todayButton) todayButton.addEventListener("click", hideToday);
  })();
</script>

<!-- =========================================================
     CATEGORY AUTO LOAD
========================================================= -->

<script>
  (function () {
    var MENU_ID = "jjCategoryMenu";
    var ENDPOINT = "/exec/front/Product/SubCategory";

    function getMenu() {
      return document.getElementById(MENU_ID);
    }

    function categoryHref(item) {
      return (
        item.link_product_list ||
        "/product/list.html?cate_no=" + encodeURIComponent(item.cate_no)
      );
    }

    function getChildren(categories, parentCateNo) {
      return categories.filter(function (item) {
        return String(item.parent_cate_no) === String(parentCateNo);
      });
    }

    function makeSubMenu(categories, parentCateNo, depth) {
      var children = getChildren(categories, parentCateNo);

      if (!children.length) {
        return null;
      }

      var ul = document.createElement("ul");

      ul.className = "jj-header-sub jj-header-sub--depth-" + depth;

      children.forEach(function (item) {
        var li = document.createElement("li");

        li.className = "jj-header-sub__item";

        li.setAttribute("data-cate-no", item.cate_no);

        var a = document.createElement("a");

        a.className = "jj-header-sub__link";

        a.href = categoryHref(item);

        a.textContent = item.name;

        li.appendChild(a);

        /*
         * depth 1 = 2차
         * depth 2 = 3차
         * depth 3 = 4차
         */
        if (depth < 3) {
          var nested = makeSubMenu(categories, item.cate_no, depth + 1);

          if (nested) {
            li.appendChild(nested);
          }
        }

        ul.appendChild(li);
      });

      return ul;
    }

    function renderCategories(categories) {
      var menu = getMenu();

      if (!menu) {
        return;
      }

      var topCategories = getChildren(categories, 1);

      menu.innerHTML = "";

      topCategories.forEach(function (item) {
        var li = document.createElement("li");

        li.className = "jj-header-category__item";

        li.setAttribute("data-cate-no", item.cate_no);

        var a = document.createElement("a");

        a.className = "jj-header-category__link";

        a.href = categoryHref(item);

        /*
         * 혹시 카테고리명이
         * "(대분류) Outerwear"
         * 형태라면 앞의 (대분류) 제거
         */
        a.textContent = String(item.name || "").replace(
          /^\s*\(대분류\)\s*/i,
          "",
        );

        li.appendChild(a);

        var subMenu = makeSubMenu(categories, item.cate_no, 1);

        if (subMenu) {
          li.appendChild(subMenu);
        }

        menu.appendChild(li);
      });
    }

    function loadCategories(attempt) {
      attempt = attempt || 1;

      fetch(ENDPOINT, {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store",
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();
        })

        .then(function (categories) {
          if (!Array.isArray(categories)) {
            throw new Error("Invalid category response");
          }

          renderCategories(categories);
        })

        .catch(function (error) {
          if (attempt < 3) {
            window.setTimeout(function () {
              loadCategories(attempt + 1);
            }, 350 * attempt);

            return;
          }

          console.warn("JUN & JAY category load failed:", error);
        });
    }

    function initCategoryMenu() {
      var menu = getMenu();

      if (!menu) {
        return;
      }

      if (menu.getAttribute("data-jj-initialized") === "true") {
        return;
      }

      menu.setAttribute("data-jj-initialized", "true");

      loadCategories(1);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initCategoryMenu, {
        once: true,
      });
    } else {
      initCategoryMenu();
    }
  })();
</script>

<!-- =========================================================
     HEADER FIXED - BODY DIRECT MODE
     탑배너는 처음에 보이고, 스크롤하면 위로 사라짐
     헤더는 계속 화면 상단에 남음
========================================================= -->
<script>
  (function () {
    function initJjFixedHeader() {
      var header = document.getElementById("jjHeader");
      var banner = document.getElementById("jjCustomEventBanner");

      if (!header || header.getAttribute("data-jj-body-fixed") === "true")
        return;

      header.setAttribute("data-jj-body-fixed", "true");

      /* 헤더가 원래 있던 자리에 공간을 남긴다 */
      var spacer = document.createElement("div");
      spacer.id = "jjHeaderBodySpacer";
      spacer.style.width = "100%";
      spacer.style.height = header.offsetHeight + "px";
      header.parentNode.insertBefore(spacer, header);

      /* transform/overflow가 걸린 카페24 부모에서 헤더를 body로 직접 이동 */
      document.body.appendChild(header);

      header.style.setProperty("position", "fixed", "important");
      header.style.setProperty("left", "0", "important");
      header.style.setProperty("right", "0", "important");
      header.style.setProperty("width", "100%", "important");
      header.style.setProperty("z-index", "999999", "important");
      header.style.setProperty("transform", "none", "important");
      header.style.setProperty("opacity", "1", "important");
      header.style.setProperty("visibility", "visible", "important");
      header.style.setProperty("display", "block", "important");
      header.style.setProperty("background", "#fff", "important");

      function visibleBannerHeight() {
        if (!banner) return 0;
        var style = window.getComputedStyle(banner);
        if (style.display === "none" || style.visibility === "hidden") return 0;
        return banner.offsetHeight;
      }

      function updateHeaderPosition() {
        var bannerHeight = visibleBannerHeight();
        var scrollTop =
          window.pageYOffset || document.documentElement.scrollTop || 0;

        /*
         * 처음: 배너 바로 아래에 헤더
         * 스크롤: 배너가 올라가는 만큼 헤더도 같이 위로 이동
         * 배너를 다 지나면 top:0으로 고정
         */
        var top = Math.max(0, bannerHeight - scrollTop);

        /* 첫 화면에서는 상단 유틸을 보여주고, 스크롤 시 위로 숨긴다 */
        var shouldCompact = scrollTop > 10;
        var compactChanged =
          header.classList.contains("jj-header--scrolled") !== shouldCompact;

        header.classList.toggle("jj-header--scrolled", shouldCompact);

        header.style.setProperty("top", top + "px", "important");
        spacer.style.height = header.offsetHeight + "px";

        if (compactChanged) {
          window.setTimeout(function () {
            spacer.style.height = header.offsetHeight + "px";
          }, 300);
        }
      }

      updateHeaderPosition();

      window.addEventListener("scroll", updateHeaderPosition, {
        passive: true,
      });
      window.addEventListener("resize", updateHeaderPosition);
      window.addEventListener("jjBannerChanged", updateHeaderPosition);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initJjFixedHeader, {
        once: true,
      });
    } else {
      initJjFixedHeader();
    }
  })();
</script>

<script>
  (function () {
    function initJjMobileMenu() {
      var openButton = document.querySelector(
        "#jjHeader .jj-header-menu-button",
      );

      var menu = document.getElementById("jjMobileMenu");

      var overlay = document.getElementById("jjMobileMenuOverlay");

      var closeButton = document.getElementById("jjMobileMenuClose");

      var categoryContainer = document.getElementById("jjMobileCategory");

      if (
        !openButton ||
        !menu ||
        !overlay ||
        !closeButton ||
        !categoryContainer
      ) {
        return;
      }

      /* =====================================
     메뉴 열기
  ===================================== */

      function openMenu(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        document.body.classList.add("jj-mobile-menu-open");

        menu.setAttribute("aria-hidden", "false");
      }

      /* =====================================
     메뉴 닫기
  ===================================== */

      function closeMenu() {
        document.body.classList.remove("jj-mobile-menu-open");

        menu.setAttribute("aria-hidden", "true");
      }

      /*
       * Cafe24 기존 eNavFold 이벤트보다
       * 우리가 만든 이벤트를 우선 실행
       */
      openButton.addEventListener("click", openMenu, true);

      closeButton.addEventListener("click", closeMenu);

      overlay.addEventListener("click", closeMenu);

      /* ESC */
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeMenu();
        }
      });

      /* =====================================
     카테고리 불러오기
  ===================================== */

      function getChildren(categories, parent) {
        return categories.filter(function (item) {
          return String(item.parent_cate_no) === String(parent);
        });
      }

      function categoryHref(item) {
        return (
          item.link_product_list ||
          "/product/list.html?cate_no=" + encodeURIComponent(item.cate_no)
        );
      }

      function makeSubMenu(categories, parentCateNo) {
        var children = getChildren(categories, parentCateNo);

        if (!children.length) {
          return null;
        }

        var ul = document.createElement("ul");

        ul.className = "jj-mobile-sub";

        children.forEach(function (item) {
          var li = document.createElement("li");

          var a = document.createElement("a");

          a.href = categoryHref(item);

          a.textContent = String(item.name || "").replace(
            /^\s*\(대분류\)\s*/i,
            "",
          );

          li.appendChild(a);

          ul.appendChild(li);
        });

        return ul;
      }

      function renderMobileCategories(categories) {
        var topCategories = getChildren(categories, 1);

        categoryContainer.innerHTML = "";

        topCategories.forEach(function (item) {
          var li = document.createElement("li");

          li.className = "jj-mobile-category__item";

          var row = document.createElement("div");

          row.className = "jj-mobile-category__row";

          var a = document.createElement("a");

          a.className = "jj-mobile-category__link";

          a.href = categoryHref(item);

          a.textContent = String(item.name || "").replace(
            /^\s*\(대분류\)\s*/i,
            "",
          );

          row.appendChild(a);

          var sub = makeSubMenu(categories, item.cate_no);

          if (sub) {
            var toggle = document.createElement("button");

            toggle.type = "button";

            toggle.className = "jj-mobile-category__toggle";

            toggle.setAttribute("aria-label", "하위 메뉴 열기");

            toggle.addEventListener("click", function (event) {
              event.preventDefault();
              event.stopPropagation();

              li.classList.toggle("is-open");
            });

            row.appendChild(toggle);
          }

          li.appendChild(row);

          if (sub) {
            li.appendChild(sub);
          }

          categoryContainer.appendChild(li);
        });
      }

      fetch("/exec/front/Product/SubCategory", {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store",
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();
        })

        .then(function (categories) {
          if (Array.isArray(categories)) {
            renderMobileCategories(categories);
          }
        })

        .catch(function (error) {
          console.warn("JUN & JAY mobile menu load failed:", error);
        });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initJjMobileMenu, {
        once: true,
      });
    } else {
      initJjMobileMenu();
    }
  })();
</script>
