<style>
  /* ON STORE! 2열 정사각형 이미지 배너 */
  .on-store-grid .main_3dan_banner > ul {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;

    width: 100% !important;
  }

  .on-store-grid .main_3dan_banner > ul > li {
    width: 100% !important;
    margin: 0 !important;
  }

  .on-store-grid .main_3dan_banner > ul > li > a {
    position: relative;
    display: block;
    overflow: hidden;
  }

  .on-store-grid .main_3dan_banner picture {
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .on-store-grid .main_3dan_banner picture img {
    display: block;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .on-store-grid .main_3dan_banner li:hover picture img {
    transform: scale(1.04);
  }

  .on-store-grid .main_banner_txt {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    padding: 18px 20px;
    color: #fff;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
  }

  .on-store-grid .main_banner_txt01 {
    font-size: 20px;
    font-weight: 600;
  }

  .on-store-grid .main_banner_more {
    display: none;
  }

  @media (max-width: 767px) {
    .on-store-grid .main_banner_txt {
      padding: 12px;
    }

    .on-store-grid .main_banner_txt01 {
      font-size: 15px;
    }
  }
</style>

<section
  class="section main_product_list"
  data-ez-module="product-list/1"
  data-ez-layout="grid4"
>
  <ez-prop data-version="1.0.0">
    <ez-var
      data-prop="layout"
      data-namespace="ez.module.product-list.layout"
      data-type="array"
    >
      <ez-item
        data-id="grid3"
        data-name="일반3단형(PC 3열/MOBILE 1열)"
      ></ez-item>
      <ez-item
        data-id="grid4"
        data-name="일반4단형(PC 4열/MOBILE 2열)"
      ></ez-item>
      <ez-item
        data-id="grid5"
        data-name="일반5단형(PC 5열/MOBILE 2열)"
      ></ez-item>
      <ez-item
        data-id="grid3 list_gallery"
        data-name="이미지강조3단형(PC 3열/MOBILE 1열)"
      ></ez-item>
      <ez-item
        data-id="grid4 list_gallery"
        data-name="이미지강조4단형(PC 4열/MOBILE 2열)"
      ></ez-item>
      <ez-item
        data-id="grid5 list_gallery"
        data-name="이미지강조5단형(PC 5열/MOBILE 2열)"
      ></ez-item>
    </ez-var>
  </ez-prop>

  <div
    class="main_title ez-align-center"
    data-ez-role="ez-align"
    data-ez-align="center"
  >
    <!-- 메인 새로운신상품 타이틀 수정하는곳 -->
    <div class="main_title_txt01" data-ez-role="title">NEW! ARRIVAL</div>
    <div class="main_title_txt02" data-ez-role="subtitle">
      언제나 새로운 신상품
    </div>
  </div>
  <!-- //main_title -->

  <div data-ez-holder="product_listmain">
    <div module="product_listmain_1" class="ec-base-product">
      <!--
				$count = 8
				$basket_result = /product/add_basket.html
				$basket_option = /product/basket_option.html
				$moreview = yes
				$cache = yes
			-->
      <ul class="prdList grid4" data-ez-role="layout ez-discount-tag">
        <!--@import(/product/list_product.html)-->
      </ul>
    </div>
    <div module="product_listmore_1" class="more">
      <a
        href="#none"
        onclick="
          {
            $more_action;
          }
        "
        class="btnMore"
      >
        상품 더보기
        <div>
          (<span id="more_current_page_{$display_group}">{$current_page}</span
          >/<span id="more_total_page_{$display_group}">{$total_page}</span>)
        </div>
      </a>
    </div>
  </div>
</section>
